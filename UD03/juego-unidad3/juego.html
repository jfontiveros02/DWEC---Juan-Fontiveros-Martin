<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel del jugador</title>
    <link rel="stylesheet" href="css/estilos.css">
    <script src="js/utilidades.js" defer></script>
    <script src="js/juego.js" defer></script>
    <script src="js/estilos.js" defer></script>
    <script src="js/adivina.js" defer></script>
    <script src="js/almacenamiento.js" defer></script>
    <script src="js/ventana.js" defer></script>
</head>
<body>
    <h1>Panel del jugador</h1>

    <div id="panel">
        <p id="nombreJugador"></p>
        <p id="edadJugador"></p>
        <p id="cumpleJugador"></p>
    </div>
    <div id="juego">
        <h2>Adivina el n&uacute;mero (1 a 10)</h2>
        <input type="text" id="numero">
        <button id="btnProbar">Probar</button>
        <button id="btnNueva">Nueva partida</button>
        <p id="pista"></p>
        <p id="intentos">Intentos: 0</p>
        <p id="puntos">Puntos: 0</p>
    </div>
    <div id="datos">
        <p id="record">R&eacute;cord: 0</p>
        <p id="ultimaPartida"></p>
        <p id="ultimaVisita"></p>
        <button id="btnAyuda">Ayuda</button>
    </div>
</body>
</html>
